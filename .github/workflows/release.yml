name: Публикация релиза
on:
  push:
    branches: [dev]
    paths: 
      - CHANGELOG.md
      - .release-please-manifest.json

jobs:
  release-please:
    name: Работа Release-Please
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38
        id: release
        with:
          token: ${{ steps.bot-token.outputs.token }}
          skip-github-pull-request: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  update-release:
    name: Сборка
    needs: release-please
    if: ${{ needs.release-please.outputs.release == 'true' }}
    runs-on: windows-2022
    defaults: 
      run:
        shell: pwsh
    steps:
      - id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: shrink/actions-document-publish@v1
        id: pdf-changelog
        with:
          sources: 'CHANGELOG.md'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Сборка Correctum
        run: |
          dotnet publish Correctum/Correctum.csproj --self-contained --runtime win-x86 `
            --output bin --configuration Release -p:Version=${{ needs.release-please.outputs.version }} --nologo
      - name: Сборка установщика Correctum
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=${{ needs.release-please.outputs.version }}" `
            "/DSourcePath=bin" "/DOutDir=." "Correctum.iss"
      - name: Добавлены ассет в релиз
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          token: ${{ steps.bot-token.outputs.token }}
          tag_name: ${{ needs.release-please.outputs.tag }}
          files: |
            ${{ steps.pdf-changelog.outputs.pdf }}
            Correctum-${{ needs.release-please.outputs.version }}.exe