name: Публикация релиза
on:
  push:
    branches: [dev]
    paths: 
      - CHANGELOG.md
      - .release-please-manifest.json

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Работа Release-Please
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GHTOKEN }}
          skip-github-pull-request: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  update-release:
    name: Сборка
    needs: release-please
    if: ${{ needs.release-please.outputs.release == 'true' }}
    runs-on: windows-2022
    defaults: 
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Сборка RetailCorrector
        run: |
          dotnet publish RetailCorrector/RetailCorrector.csproj --self-contained --runtime win-x86 `
            --output bin --configuration Release -p:Version=${{ needs.release-please.outputs.version }} --nologo
      - name: Сборка установщика RetailCorrector
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=${{ needs.release-please.outputs.version }}" `
            "/DSourcePath=bin" "/DOutDir=." "RetailCorrector.iss"
      - name: Добавлены ассет в релиз
        uses: softprops/action-gh-release@v2
        with:
          files: RetailCorrector-${{ needs.release-please.outputs.version }}.exe
          tag_name: ${{ needs.release-please.outputs.tag }}