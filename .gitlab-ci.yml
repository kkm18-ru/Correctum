stages:
  - build:debug
  - tests:unit
  - analyze:sonarcloud
  - release

.mr-dev:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
    - when: never

include:
  - local: .gitlab/ci/dev.gitlab-ci.yml

build-to-tg:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  tags:
    - dotnet9
    - inno-setup
    - powershell7
    - windows10
  script:
    - pwsh -File "./build.ps1" -Version "$CI_COMMIT_TAG" -BotToken "$TELEGRAM_TOKEN" -ChatId "$TELEGRAM_CHATID"