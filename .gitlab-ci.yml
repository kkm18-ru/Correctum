stages:
  - release
  
build-to-tg:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  tags:
    - dotnet9
    - inno-setup
    - powershell7
    - windows10
  script:
    - '"C:\\Program Files\\PowerShell\\7\\pwsh.exe" -File "./build.ps1" -Version "$CI_COMMIT_TAG" -BotToken "$TELEGRAM_TOKEN" -ChatId "$TELEGRAM_CHATID"''