.mr-dev:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" && $CI_MERGE_REQUEST_DRAFT == "false"'
    - when: never
  
build:debug:
  stage: build:debug
  extends: .mr-dev
  tags: [windows, dotnet10]
  script:
    - dotnet publish RetailCorrector/RetailCorrector.csproj -c Debug -r win-x86 --sc -o bin
  artifacts:
    name: DebugBuild
    paths: 
      - bin\
    expire_in: 3 days

tests:unit:
  stage: tests:unit
  extends: .mr-dev
  needs: [build:debug]
  tags: [windows, dotnet10]
  script:
    - dotnet test

analyze:sonarcloud:
  stage: analyze:sonarcloud
  extends: .mr-dev
  needs: [tests:unit]
  tags: [windows, dotnet10, sonarscanner, dotnet-coverage]
  script:
    - dotnet sonarscanner begin /k:"ornaras_retailcorrector" /o:"gitlabornaras" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="$SONAR_HOST_URL" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
    - dotnet build --no-incremental
    - dotnet-coverage collect "dotnet test" -f xml -o "coverage.xml"
    - dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
